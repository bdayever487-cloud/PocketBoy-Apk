name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Create .env (se necessário)
        run: |
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi
          # Se o app usar chave de API, defina o secret GEMINI_API_KEY no repositório
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          fi

      - name: Make gradlew executable
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Create debug.keystore (se não existir)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: |
          # Flags: o KSP falha com compilação "in-process" + paralelismo,
          # então usamos o daemon do Kotlin e desligamos o paralelismo no CI.
          FLAGS="-Pkotlin.compiler.execution.strategy=daemon -Dorg.gradle.parallel=false --stacktrace"
          if [ -f gradlew ]; then
            ./gradlew assembleDebug $FLAGS
          else
            gradle assembleDebug $FLAGS
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketBoy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
